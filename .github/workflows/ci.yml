name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Build and regress against the pgdg packages: a gcc build on a stock
  # distribution, independent of the Nix flake (which builds with clang).
  # ci/pgdg.sh is shared with the Codeberg pipeline (.woodpecker/ci.yaml).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [17, 18, 19]
    steps:
      # The upgrade test builds the 0.1.0 starting points from their commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build and test against PGDG PostgreSQL ${{ matrix.pg }}
        run: bash ci/pgdg.sh ${{ matrix.pg }}

      - name: Inference engine against brute force (plain, ASan+UBSan)
        if: matrix.pg == 19
        run: CC=gcc bash test/engine/run.sh 1 20000

      - name: Marginals against pgmpy
        if: matrix.pg == 19
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pgmpy 'psycopg[binary]'
          pg_virtualenv -v ${{ matrix.pg }} /tmp/venv/bin/python test/pgmpy/check.py --models 300
          pg_virtualenv -v ${{ matrix.pg }} /tmp/venv/bin/python test/pgmpy/em.py --models 200

  # The flake gate: PG 17, 18 and 19 from nixpkgs, built with clang.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - run: nix flake check -L
